spring.application.name=whattopack
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Data Base Connection
db.url=jdbc:mysql://localhost:3306/whattopack?useSSL=false&serverTimezone=UTC&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
db.username={mysql user}
db.password={mysql password}

# JPA
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true